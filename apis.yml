aid: slow-ventures
name: Slow Ventures
description: >-
  Slow Ventures is a generalist early-stage venture capital firm founded in 2011 and headquartered in
  San Francisco, with additional offices in Boston and New York. The firm leads pre-seed and seed rounds,
  writing typical checks of roughly $500K to $3M (averaging around $1.75M), and explicitly rejects
  thematic investing in favor of backing experienced founders with deep, hard-won domain expertise and
  genuine conviction. Slow's thesis funds rapid, high-stakes experimentation: capital that tests a novel
  risk or hypothesis whose validation dramatically increases a company's value and that cannot easily be
  funded another way. As a generalist, Slow invests across consumer and social, fintech, SaaS and
  enterprise/developer tools, healthcare, crypto/web3, the creator economy, and real-world operations
  (SMB acceleration, buyouts/rollups, franchising). The firm runs a dedicated Creator Fund backing
  creator-led businesses, and has deployed roughly $800M+ across multiple fund vintages since inception.
  Notable investments include Pinterest, Slack, Robinhood, Nextdoor, Postmates, Opendoor, Wealthfront,
  Casper, PillPack, Airtable, Gusto, and Solana.
